app = "linkbot"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[[services]]
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

[env]

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[restart]]
  policy = "always"
  retries = 10